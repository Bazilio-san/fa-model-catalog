remote:
  host: server.example.com
  keyPath: C:/Users/<user>/.ssh/id_rsa
  port: 22
  publicHost: catalog.example.com
  repository: https://github.com/Bazilio-san/fa-model-catalog.git
  user: root
access:
  clients:
    - id: shared
      keys:
        - id: primary
          token: REPLACE_WITH_ACCESS_TOKEN
server:
  accessFile: /etc/fa-model-catalog/access.yaml
  catalogFile: /var/opt/node/fa-model-catalog/catalog.yaml
  host: 127.0.0.1
  port: 19062
  reloadIntervalMs: 5000
